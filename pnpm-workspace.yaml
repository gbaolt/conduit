packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  sharp: true
  '@prisma/engines': true
  '@prisma/client': true
  prisma: true
  esbuild: true
  '@prisma/ppg': true
  '@scarf/scarf': true
  '@swc/core': true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.10'
  - '@turbo/darwin-arm64@2.11.10'
  - '@turbo/linux-64@2.11.10'
  - '@turbo/linux-arm64@2.11.10'
  - '@turbo/windows-64@2.11.10'
  - '@turbo/windows-arm64@2.11.10'
  - eslint-plugin-turbo@2.11.10
  - turbo@2.11.10

overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

peerDependencyRules:
  allowedVersions:
    eslint: '10'
