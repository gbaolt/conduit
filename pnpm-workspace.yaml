  - '@turbo/darwin-arm64@2.11.10'
  - '@turbo/linux-64@2.11.10'
  - '@turbo/linux-arm64@2.11.10'
  - '@turbo/windows-64@2.11.10'
  - '@turbo/windows-arm64@2.11.10'
  - eslint-plugin-turbo@2.11.10
  - turbo@2.11.10

overrides:
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'

peerDependencyRules:
  allowedVersions:
    eslint: '10'
