name: Email digest

# GitHub starts scheduled runs late, and stops them after 60 days without repository activity.
# The endpoint is idempotent, so a late, repeated, or skipped run only shifts when an email goes out.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: email-digest
  cancel-in-progress: false

permissions: {}

jobs:
  send:
    name: Send digests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the digest endpoint
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: >
          curl --fail --silent --show-error --max-time 120 --request POST
          --header "Authorization: Bearer $CRON_SECRET"
          "$API_URL/internal/digests"
